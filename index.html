const TRANS=`সে প্রতিদিন সকালে হাঁটতে যায়।|He goes for a walk every morning.|Habitual action: simple present, 'goes for a walk'.
আমি তিন বছর ধরে ইংরেজি শিখছি।|I have been learning English for three years.|'ধরে' with a time span: present perfect continuous with 'for'.
বৃষ্টি হচ্ছিল বলে আমরা বাইরে যাইনি।|We did not go out because it was raining.|'বলে' as a reason: because.
পরীক্ষার ফল শুনে সে খুশি হলো।|She was happy to hear the exam result.|'শুনে' becomes 'to hear' after an adjective of feeling.
তুমি যদি কঠোর পরিশ্রম করো, তাহলে সফল হবে।|If you work hard, you will succeed.|First conditional: if + present, will + verb.
আমি তাকে কাল দেখা করতে বলেছি।|I have asked him to meet me tomorrow.|ask + object + to-infinitive.
সময় অর্থের চেয়েও মূল্যবান।|Time is more valuable than money.|Comparative with 'than'.
সে আমার কাছ থেকে একটি বই ধার নিয়েছে।|He borrowed a book from me.|borrow from, lend to.
আমি জানি না সে কোথায় থাকে।|I do not know where he lives.|Noun clause: keep statement word order after 'where'.
ছাত্রটি এত ভালো যে সবাই তাকে পছন্দ করে।|The student is so good that everyone likes him.|so ... that for result.
সে এলে আমি তাকে বলব।|I will tell him when he comes.|After 'when' use present, not 'will'.
আজ রাতে আমাদের একটি সভা আছে।|We have a meeting tonight.|'আছে' as possession or schedule: have.
তিনি একজন বিখ্যাত লেখক ছিলেন।|He was a famous writer.|Article 'a' before a consonant sound.
আমি যদি পাখি হতাম, তাহলে উড়ে যেতাম।|If I were a bird, I would fly away.|Unreal condition: 'were' for all subjects.
কাজটি শেষ না করা পর্যন্ত সে ঘুমায়নি।|He did not sleep until he finished the work.|not ... until.
সত্য কথা বলা উচিত।|One should speak the truth.|'উচিত' becomes should.
গরিবদের সাহায্য করা আমাদের কর্তব্য।|It is our duty to help the poor.|It is + noun + to-infinitive.
সে ইংরেজিতে কথা বলতে ভয় পায়।|She is afraid of speaking in English.|afraid of + gerund.
বইটি টেবিলের ওপর রাখা আছে।|The book is kept on the table.|Passive voice with 'on' for surface.
আমরা সবাই একসঙ্গে খেলতে গিয়েছিলাম।|We all went to play together.|Past simple 'went' plus purpose infinitive.
সে আমাকে সাহায্য করতে রাজি হয়েছে।|He has agreed to help me.|agree to + verb.
দেরি হয়ে যাচ্ছে, আমাদের এখনই যেতে হবে।|It is getting late; we must go now.|'হতে হবে' as obligation: must or have to.
যে বেশি পড়ে সে বেশি জানে।|He who reads more knows more.|Relative pronoun 'who' as subject.
আমি তার কথায় বিশ্বাস করি না।|I do not believe his words.|Direct object, no preposition.
পরিশ্রম ছাড়া কেউ সফল হতে পারে না।|No one can succeed without hard work.|'No one' already negative; do not add 'not'.
সে এমনভাবে কথা বলে যেন সবকিছু জানে।|He talks as if he knew everything.|as if + past for unreal comparison.
আমি ঢাকায় জন্মেছি এবং এখানেই বড় হয়েছি।|I was born in Dhaka and grew up here.|be born in; grew up (no 'was').
তুমি কি আমার সঙ্গে যাবে?|Will you come with me?|Question order: Will + subject + verb.
সে অসুস্থ থাকায় অফিসে আসেনি।|He did not come to the office as he was ill.|'থাকায়' as cause: as or because.
আমার ইচ্ছা আমি একজন উদ্যোক্তা হব।|I aspire to become an entrepreneur.|aspire to + verb.
এই কাজটি করতে আমার দুই ঘণ্টা সময় লাগবে।|It will take me two hours to do this work.|It takes + person + time + to-infinitive.
ছাত্ররা শিক্ষকের কথা মনোযোগ দিয়ে শুনছে।|The students are listening to the teacher attentively.|listen to; present continuous.
সে পরীক্ষায় প্রথম হয়েছে।|He stood first in the examination.|stand first; in the exam.
নদীটি শহরের মধ্য দিয়ে বয়ে গেছে।|The river flows through the city.|through for movement inside.
আমি তাকে চিনি, কিন্তু কখনো কথা বলিনি।|I know him, but I have never spoken to him.|never + present perfect; speak to.
সময়মতো কাজ শেষ করা জরুরি।|It is important to finish work on time.|on time vs in time.
সরকার নতুন একটি নীতি ঘোষণা করেছে।|The government has announced a new policy.|Present perfect for a recent result.
যত তাড়াতাড়ি সম্ভব আমাকে জানাবেন।|Please let me know as soon as possible.|let me know: fixed polite phrase.
সে ধনী হলেও সুখী নয়।|Though he is rich, he is not happy.|Though ... (no 'but' in the same sentence).
ভালো ফল করার জন্য সে রাত জেগে পড়ছে।|He is studying late into the night to get a good result.|Purpose: to + verb.`.split('\n').map(l=>{const p=l.split('|');return{bn:p[0],en:p[1],tip:p[2]}});

const PARTS=['of','to','for','on','in','with','from','by','at','after','against','over','about','around'];
const TASKS=[['video','Video'],['vocab','5 words'],['prep','Prepositions'],['trans','Translation'],['quiz','Quiz']];

/* ---------- state ---------- */
const def=()=>({start:'2026-10-19',links:{},tasks:{},notes:{},quiz:{}});
let S=def();
try{const r=localStorage.getItem('e272');if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('e272',JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDate(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function dayDate(d){const x=parseDate(S.start);x.setDate(x.getDate()+d-1);return x}
function fmt(d,long){return d.toLocaleDateString('en-GB',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'})}
function todayN(){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((t-parseDate(S.start))/864e5)+1;return Math.min(TOTAL,Math.max(1,n))}
let day=todayN();
const T=d=>S.tasks[d]||(S.tasks[d]={});
const complete=d=>TASKS.every(t=>T(d)[t[0]]);
function stats(){
  let vids=0,done=0;for(let d=1;d<=TOTAL;d++){if((S.tasks[d]||{}).video)vids++;if(complete(d))done++}
  let streak=0,d=todayN();if(!complete(d))d--;while(d>=1&&complete(d)){streak++;d--}
  const qs=Object.values(S.quiz);const avg=qs.length?Math.round(qs.reduce((a,q)=>a+q.s/q.t,0)/qs.length*100):null;
  return{vids,done,streak,avg};
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const wordsFor=d=>[0,1,2,3,4].map(i=>WORDS[((d-1)*5+i)%WORDS.length]);
const prepsFor=d=>[0,1].map(i=>PREPS[((d-1)*2+i)%PREPS.length]);
const transFor=d=>[0,1].map(i=>TRANS[((d-1)*2+i)%TRANS.length]);
const round=d=>Math.floor((d-1)*5/WORDS.length)+1;

/* ---------- quiz ---------- */
let Q=null;
function buildQuiz(mode,d){
  const r=mode==='day'?rng(d*7919):rng(Date.now()&0xffffff);
  let ws,ps;
  if(mode==='day'){ws=wordsFor(d);ps=prepsFor(d)}
  else{const maxD=Math.max(todayN(),d);const pw=[],pp=[];for(let k=1;k<=maxD;k++){wordsFor(k).forEach(x=>pw.push(x));prepsFor(k).forEach(x=>pp.push(x))}
    ws=shuffle([...new Set(pw)],r).slice(0,10);ps=shuffle([...new Set(pp)],r).slice(0,5)}
  const items=[];
  ws.forEach(w=>{const others=shuffle(WORDS.filter(x=>x.m!==w.m),r).slice(0,3).map(x=>x.m);
    items.push({q:`What does <span class="hl">${esc(w.w)}</span> mean?`,opts:shuffle([w.m,...others],r),a:w.m,note:w.ex})});
  ps.forEach(p=>{const others=shuffle(PARTS.filter(x=>x!==p.p),r).slice(0,3);
    items.push({q:`Fill the blank: <span class="hl">${esc(p.v)} ___</span><br><span style="font-weight:500;font-size:18px">${esc(p.s)}</span>`,opts:shuffle([p.p,...others],r),a:p.p,note:`${p.v} ${p.p}: ${p.m}`})});
  Q={mode,d,items:shuffle(items,r),i:0,score:0,picked:null,fin:false};
}

    return `<section class="blk"><h2>Quiz</h2><p class="sub">Pick a quiz. Questions come from the words and prepositions you have unlocked.</p>${last}

  }
  const it=Q.items[Q.i],ans=Q.picked!==null;
  return `<section class="blk"><div class="qmeta"><span>${Q.mode==='day'?'Day '+Q.d:'Review'}</span><span>${Q.i+1} / ${Q.items.length}</span></div>
    <div class="quizq">${it.q}</div>
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt ${ans?(o===it.a?'right':(i===Q.picked?'wrong':'')):''}" data-a="opt" data-i="${i}" ${ans?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    ${ans?`<p class="note" style="margin-top:14px">${esc(it.note)}</p><button class="btn pri" data-a="qnext">${Q.i+1>=Q.items.length?'See score':'Next question'}</button>`:''}</section>`;

  const phrases=[];Object.keys(S.notes).map(Number).sort((a,b)=>a-b).forEach(d=>(S.notes[d]||[]).forEach(x=>{if(x)phrases.push([d,x])}));
  return `<section><h2>Words unlocked (${ws.length})</h2><p class="sub">Everything up to day ${maxD}.</p><input type="text" id="lsearch" placeholder="Search words or meanings" aria-label="Search library" style="margin-bottom:12px">

    <div class="chips" style="margin-bottom:16px"><span class="chip">${s.vids} videos watched</span><span class="chip">${s.done} days complete</span><span class="chip">${s.streak} day streak</span><span class="chip">${s.avg===null?'No quizzes yet':'Quiz average '+s.avg+'%'}</span><span class="chip">${n} links saved</span></div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>All five tasks done</span><span><i style="background:color-mix(in srgb,var(--accent) 28%,var(--surface))"></i>Video done</span><span><i style="outline:2px solid var(--ink)"></i>Today</span></div></section>`;
}

function vSetup(){
  return `<section class="blk"><h2>Start date</h2><p class="sub">Day 1 of 272. Your last day is ${fmt(dayDate(TOTAL))}.</p>
    <input type="date" id="startin" value="${esc(S.start)}" aria-label="Start date" style="max-width:220px"></section>
  <section class="blk"><h2>Import all video links</h2>
    <p class="sub">Open the channel's Videos tab, copy each video link, and paste them here one per line in the order you want to watch them. Link 1 becomes Day 1, link 2 becomes Day 2, and so on.</p>
    <textarea id="bulk" style="min-height:160px" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..." aria-label="Video links"></textarea>
    <div class="row" style="margin-top:10px"><label for="bulkstart" class="note">Start at day</label><input type="number" id="bulkstart" value="1" min="1" max="${TOTAL}" style="max-width:100px"><button class="btn pri" data-a="import">Import links</button></div>
    <p class="note" id="bulkmsg" role="status"></p></section>
  <section class="blk"><h2>Backup</h2><p class="sub">Progress lives in this browser only. Copy the backup text somewhere safe, or paste it here to restore.</p>
    <textarea id="backup" aria-label="Backup data">${esc(JSON.stringify(S))}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-a="copyb">Copy backup</button><button class="btn sm" data-a="restore">Restore from text</button></div>
    <p class="note" id="bmsg" role="status"></p></section>`;
}

/* ---------- render ---------- */
function render(){
  const tab=(location.hash||'#today').slice(1);const ok=tabs().map(t=>t[0]);const cur=ok.includes(tab)?tab:'today';
  document.getElementById('nav').innerHTML=tabs().map(t=>`<a href="#${t[0]}" ${t[0]===cur?'aria-current="page"':''}>${t[1]}</a>`).join('');
  const st=stats();
  document.getElementById('stats').innerHTML=`<div><b>${st.vids}</b>videos</div><div><b>${st.streak}</b>streak</div>`;
  document.getElementById('bar').style.width=(st.vids/TOTAL*100)+'%';
  const v={today:vToday,quiz:vQuiz,library:vLibrary,journey:vJourney,setup:vSetup}[cur];
  document.getElementById('main').innerHTML=v();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='prev'&&day>1){day--;render()}
  else if(a==='next'&&day<TOTAL){day++;render()}
  else if(a==='jumptoday'){day=todayN();render()}
  else if(a==='goto'){day=+b.dataset.d;location.hash='#today';render();window.scrollTo(0,0)}
  else if(a==='task'){const t=T(day);t[b.dataset.t]=!t[b.dataset.t];save();render()}
  else if(a==='savelink'){const v=document.getElementById('linkin').value.trim();if(v){const id=vidId(v);S.links[day]=id?'https://www.youtube.com/watch?v='+id:v}else delete S.links[day];save();render()}
  else if(a==='startq'){buildQuiz(b.dataset.m,day);if(location.hash!=='#quiz')location.hash='#quiz';else render()}
  else if(a==='opt'){if(Q.picked===null){Q.picked=+b.dataset.i;if(Q.items[Q.i].opts[Q.picked]===Q.items[Q.i].a)Q.score++;render()}}
  else if(a==='qnext'){Q.picked=null;Q.i++;if(Q.i>=Q.items.length){Q.fin=true;if(Q.mode==='day'){S.quiz[Q.d]={s:Q.score,t:Q.items.length};T(Q.d).quiz=true;save()}}render()}
  else if(a==='import'){
    const lines=document.getElementById('bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);let d=Math.max(1,Math.min(TOTAL,+document.getElementById('bulkstart').value||1)),c=0;
    lines.forEach(l=>{const id=vidId(l);if(id&&d<=TOTAL){S.links[d++]='https://www.youtube.com/watch?v='+id;c++}});save();
    document.getElementById('bulkmsg').textContent=c?`Saved ${c} links, up to day ${d-1}. ${lines.length-c} lines were skipped.`:'No YouTube links found. Paste full video links, one per line.';
  }
  else if(a==='copyb'){const t=document.getElementById('backup');const m=document.getElementById('bmsg');
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>m.textContent='Copied.').catch(()=>{t.select();m.textContent='Select and copy the text above.'})}
  else if(a==='restore'){const m=document.getElementById('bmsg');try{const o=JSON.parse(document.getElementById('backup').value);S=Object.assign(def(),o);save();m.textContent='Restored.';day=todayN()}catch(x){m.textContent='That text is not a valid backup.'}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('notein')){const n=S.notes[day]||(S.notes[day]=['','','']);n[+t.dataset.i]=t.value;save()}
  else if(t.id==='lsearch'){const q=t.value.toLowerCase();document.querySelectorAll('#wlist .libi').forEach(x=>x.hidden=q&&!x.dataset.s.includes(q))}
});
document.addEventListener('change',e=>{if(e.target.id==='startin'&&e.target.value){S.start=e.target.value;save();day=todayN();render()}});
render();
</script>

</body></html>
